plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The DJI App Key is personal: put it in dji-app-key.properties (not committed), e.g.
//   DJI_APP_KEY=0123456789abcdef...
def keyProps = new Properties()
def keyFile = rootProject.file('dji-app-key.properties')
if (keyFile.exists()) keyFile.withInputStream { keyProps.load(it) }

android {
    namespace 'com.aisecurity.dronelink'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aisecurity.dronelink'  // must match the package name registered for the DJI App Key
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        manifestPlaceholders = [API_KEY: keyProps.getProperty('DJI_APP_KEY', 'MISSING_DJI_APP_KEY')]
        ndk { abiFilters 'arm64-v8a' }  // DJI's native libraries are 64-bit ARM only
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    packaging {
        jniLibs {
            useLegacyPackaging true
            pickFirsts += ['lib/arm64-v8a/libc++_shared.so']
            // DJI's libraries are signature-checked; keep them unstripped (as in DJI's sample).
            keepDebugSymbols += ['*/*/libconstants.so', '*/*/libdji_innertools.so', '*/*/libdjibase.so',
                                 '*/*/libDJICSDKCommon.so', '*/*/libDJIFlySafeCore-CSDK.so', '*/*/libdjifs_jni-CSDK.so',
                                 '*/*/libDJIRegister.so', '*/*/libdjisdk_jni.so', '*/*/libDJIUpgradeCore.so',
                                 '*/*/libDJIUpgradeJNI.so', '*/*/libDJIWaypointV2Core-CSDK.so', '*/*/libdjiwpv2-CSDK.so',
                                 '*/*/libFlightRecordEngine.so', '*/*/libvideo-framing.so', '*/*/libwaes.so',
                                 '*/*/libagora-rtsa-sdk.so', '*/*/libc++.so', '*/*/libc++_shared.so',
                                 '*/*/libmrtc_28181.so', '*/*/libmrtc_agora.so', '*/*/libmrtc_core.so',
                                 '*/*/libmrtc_core_jni.so', '*/*/libmrtc_data.so', '*/*/libmrtc_log.so',
                                 '*/*/libmrtc_onvif.so', '*/*/libmrtc_rtmp.so', '*/*/libmrtc_rtsp.so']
        }
    }
    lint { abortOnError false }
}

dependencies {
    implementation 'com.dji:dji-sdk-v5-aircraft:5.18.0'
    compileOnly 'com.dji:dji-sdk-v5-aircraft-provided:5.18.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'  // pairing QR scanner
}
