# Builds the Windows edge installers on GitHub's Windows machines and publishes them as one GitHub release:
#   AI-Security-Command-Center-Setup-<version>.exe   standard (cloud / SaaS) edition, paired with the portal
#   AI-Command-Centre-Lebanon-Setup-<version>.exe     on-prem edition, offline licence file, compiled code
# The edge tests run first; nothing is published if they fail.
#
# Run it: GitHub → Actions → "Edge installer" → Run workflow (or push a tag such as edge-v11.2.0).
# The version comes from APP_VERSION in edge/app/launcher.pyw; release notes from releases/V<major>.<minor>.md.
# The on-prem USB package's offline AI-services file (ai-command-centre-images.tar, several GB) is not built here:
# make it on a PC with Docker Desktop with edge\installer\build_onprem.ps1.
name: Edge installer

on:
  workflow_dispatch:
    inputs:
      editions:
        description: "Which installers to build"
        type: choice
        options: [both, standard, onprem]
        default: both
      publish:
        description: "Publish as a GitHub release (otherwise only downloadable build artifacts)"
        type: boolean
        default: true
  push:
    tags: ["edge-v*"]

permissions:
  contents: write  # to create the release

concurrency:
  group: edge-installer-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.v.outputs.number }}
      notes: ${{ steps.v.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          $v = (Select-String -Path edge/app/launcher.pyw -Pattern "^APP_VERSION = '(.+)'").Matches[0].Groups[1].Value
          $d = (Select-String -Path edge/app/dashboard.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          if (-not $v -or $v -ne $d) { throw "APP_VERSION differs: launcher.pyw '$v', dashboard.py '$d'" }
          $n = $v.TrimStart('V')
          "number=$n" >> $env:GITHUB_OUTPUT
          "notes=releases/V$(($n -split '\.')[0..1] -join '.').md" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

  standard:
    needs: version
    if: github.event_name == 'push' || inputs.editions != 'onprem'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Inno Setup
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ }
          if (-not $iscc) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { throw 'Inno Setup install failed' } }
      - name: Build installer
        run: powershell -ExecutionPolicy Bypass -File edge\installer\build.ps1
      - name: Tests
        working-directory: edge
        env:
          PYTHONIOENCODING: utf-8
        run: |
          .venv-build\Scripts\python.exe -m pip install --quiet "pytest>=8,<9"
          .venv-build\Scripts\python.exe -m pytest tests
      - name: Upgrade test (install, start the app, install again over the running app)
        timeout-minutes: 15
        run: |
          $setup = (Get-ChildItem edge\installer\output\AI-Security-Command-Center-Setup-*.exe | Select-Object -First 1).FullName
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\AI Security Command Center\AI-Security-Command-Center.exe'
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$env:RUNNER_TEMP\setup1.log" -PassThru
          # Wait for Setup itself only (-Wait would also wait for the app it starts after an upgrade).
          if (-not $p.WaitForExit(600000)) { throw 'Setup did not finish in 10 minutes' }
          if ($p.ExitCode) { Get-Content "$env:RUNNER_TEMP\setup1.log" -Tail 40; throw "First install failed ($($p.ExitCode))" }
          if (-not (Test-Path $exe)) { throw "Not installed: $exe" }
          # The dashboard keeps the program file in use, the case that made upgrades fail with "DeleteFile failed".
          Start-Process $exe -ArgumentList '--dashboard'
          $up = $false
          foreach ($i in 1..60) { Start-Sleep 2; try { $up = (Invoke-RestMethod http://127.0.0.1:8080/healthz -TimeoutSec 2).ok } catch {}; if ($up) { break } }
          if (-not $up) { throw 'The installed dashboard did not start' }
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$env:RUNNER_TEMP\setup2.log" -PassThru
          # Wait for Setup itself only (-Wait would also wait for the app it starts after an upgrade).
          if (-not $p.WaitForExit(600000)) { throw 'Setup did not finish in 10 minutes' }
          Get-Content "$env:RUNNER_TEMP\setup2.log" | Select-String -Pattern 'DeleteFile|error|failed' | ForEach-Object { Write-Host $_ }
          if ($p.ExitCode) { Get-Content "$env:RUNNER_TEMP\setup2.log" -Tail 40; throw "Upgrade over the running app failed ($($p.ExitCode))" }
          $again = $false
          foreach ($i in 1..30) { Start-Sleep 2; if (Get-Process -Name 'AI-Security-Command-Center' -ErrorAction SilentlyContinue) { $again = $true; break } }
          if (-not $again) { throw 'The app was not started again after the upgrade' }
          Write-Host 'Upgrade over the running app: OK, and the app was started again.'
          Stop-Process -Name 'AI-Security-Command-Center' -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: standard-${{ needs.version.outputs.number }}
          path: edge/installer/output/AI-Security-Command-Center-Setup-*.exe
          if-no-files-found: error

  onprem:
    needs: version
    if: github.event_name == 'push' || inputs.editions != 'standard'
    runs-on: windows-latest
    timeout-minutes: 120  # compiling the app to native code takes a while
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py312
        with:
          python-version: "3.12"  # Nuitka's bundled compiler supports 3.12
      - name: Inno Setup
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ }
          if (-not $iscc) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { throw 'Inno Setup install failed' } }
      - name: Build on-prem installer
        env:
          PYTHON312: ${{ steps.py312.outputs.python-path }}
          NUITKA_COMPILER: msvc  # Visual Studio's compiler is on the runner; the MinGW download came incomplete
          NUITKA_CACHE_DIR: C:\nc
        run: powershell -ExecutionPolicy Bypass -File edge\installer\build_onprem.ps1 -SkipImages
      - uses: actions/upload-artifact@v4
        with:
          name: onprem-${{ needs.version.outputs.number }}
          path: edge/installer/output/onprem-usb/*
          if-no-files-found: error

  publish:
    needs: [version, standard, onprem]
    # Publish what was built, as long as nothing that was asked for failed.
    if: >-
      always() && needs.version.result == 'success' &&
      (github.event_name == 'push' || inputs.publish) &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $n = "${{ needs.version.outputs.number }}"
          $tag = "edge-v$n"
          $files = @(Get-ChildItem dist -Recurse -Filter *.exe | ForEach-Object FullName)
          $files += @(Get-ChildItem dist -Recurse -Filter INSTALL.txt | ForEach-Object {
            $to = Join-Path $_.DirectoryName 'On-prem-INSTALL.txt'; Copy-Item $_.FullName $to; $to })
          if (-not $files) { throw 'No installers were built.' }
          $ErrorActionPreference = 'Continue'
          gh release view $tag *> $null
          $exists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = 'Stop'
          if ($exists) {
            gh release upload $tag @files --clobber
          } else {
            $notes = "${{ needs.version.outputs.notes }}"
            $ghArgs = @($tag) + $files + @('--title', "Edge Agent V$n", '--target', "${{ github.sha }}")
            if (Test-Path $notes) { $ghArgs += @('--notes-file', $notes) } else { $ghArgs += @('--notes', 'Windows edge installers.') }
            gh release create @ghArgs
          }
          if ($LASTEXITCODE) { throw 'Publishing the release failed' }
          Write-Host "Published $($files.Count) file(s): https://github.com/${{ github.repository }}/releases/tag/$tag"
