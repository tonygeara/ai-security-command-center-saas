# Starter Frigate config, copied to <data>\frigate\config\config.yaml on first start.
# Use "Camera / Drone Setup" in the launcher to set the camera address.
# Put the real camera password in the address there; this file is never committed.
mqtt:
  enabled: true
  host: host.docker.internal
  port: 1883

go2rtc:
  streams:
    camera:
      - rtsp://USERNAME:PASSWORD@CAMERA-IP:554/stream1
    drone:
      - rtsp://host.docker.internal:8556/drone

cameras:
  camera:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    objects:
      track:
        - person
        - car
        - motorcycle
    detect:
      enabled: true
  # Enabled in config so the dashboard's Drone AI switch can turn it on and off at runtime
  # (Frigate cannot start a camera that is disabled in its config).
  drone:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/drone
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    objects:
      track:
        - person
        - car
        - motorcycle
    detect:
      enabled: true
      # DJI streams are 1440x1080 (4:3); detect at the same shape so nothing is stretched.
      width: 960
      height: 720
      fps: 5

# Default CPU detector capped at 3 threads. (OpenVINO on CPU grabs every thread and
# starved the rest of the system under real load.)
detectors:
  cpu1:
    type: cpu
    num_threads: 3

# Keep footage: motion clips 3 days, alerts/detections 14 days.
record:
  enabled: true
  motion:
    days: 3
  alerts:
    retain:
      days: 14
      mode: motion
  detections:
    retain:
      days: 14
      mode: motion
snapshots:
  enabled: true
  bounding_box: true
  retain:
    default: 14

face_recognition:
  enabled: true
  model_size: small

lpr:
  enabled: true
  model_size: small
  detection_threshold: 0.5
  recognition_threshold: 0.6
  min_area: 500
  min_plate_length: 4
